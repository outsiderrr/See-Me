# Fathom（潜心）production stack: Postgres + backend (API + B reading web).
# On the server:  cp .env.server.example .env  → fill secrets → docker compose up -d --build

# Project name pinned deliberately. Compose otherwise derives it from the directory
# name and prefixes volumes with it, so renaming /opt/see-me would make Compose look
# for a `<newname>_db-data` volume, not find it, and silently start on an EMPTY
# database while the real one sits orphaned. Pinning it decouples the data from the
# path: the directory can be renamed freely, the volume stays `see-me_db-data`.
name: see-me

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: seeme
      POSTGRES_PASSWORD: ${DB_PASSWORD:?put DB_PASSWORD in .env}
      POSTGRES_DB: see_me
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seeme -d see_me"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://seeme:${DB_PASSWORD}@db:5432/see_me
      OTP_SECRET: ${OTP_SECRET:?put OTP_SECRET in .env}
      # 验证码走邮件。dev = 只打进容器日志；resend = 真发信，要下面两项
      MAIL_DRIVER: ${MAIL_DRIVER:-dev}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # 过渡期用 dev 驱动（码只进日志）必须显式开这个，防手滑静默降级
      MAIL_DEV_IN_PROD: ${MAIL_DEV_IN_PROD:-}
      SESSION_TTL_DAYS: "60"
      PORT: "3000"
      NODE_ENV: production # cookie 的 secure 标记靠它；上 HTTPS 前一直没设
    ports:
      # 只绑本机：运维脚本（server-ingest.sh 等）直连用。公网唯一入口是 caddy。
      - "127.0.0.1:3000:3000"

  # HTTPS 前门（P1）：80/443 全在这，证书自动签发续期，配置见 ./Caddyfile
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # 证书住这——删卷 = 重新签发，会撞 Let's Encrypt 限额
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
